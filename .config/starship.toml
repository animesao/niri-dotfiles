# ASUS TUF Stealth - Starship Single-Line Configuration

format = "$directory$git_branch$git_status$cmd_duration$character"
right_format = "$status"

scan_timeout = 30

[character]
success_symbol = "[❯](bold #d8dadf) "
error_symbol = "[❯](bold #e05555) "
vicmd_symbol = "[❮](bold #e5a952) "

[directory]
style = "bold #7bbec2"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
style = "bold #8fa876"
format = "[$symbol$branch]($style)"
symbol = "󰊢 "

[git_status]
style = "bold #e5a952"
format = " ([$all_status$ahead_behind]($style))"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 3_000
style = "bold #7b9bb5"
format = " took [$duration]($style)"

[status]
disabled = false
style = "bold #e05555"
format = "[$symbol$status]($style)"
symbol = "✘ "
